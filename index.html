<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07130d">
  <title>Simulators Hub</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:40px 24px;background:#000}
    main{width:min(100%,760px);text-align:center}
    h1{margin:0 0 32px;font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-1.2px}
    .simulator-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .simulator{min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:20px;border:1px solid #292929;background:#090909;color:#fff;text-decoration:none;cursor:not-allowed;user-select:none}
    .simulator-name{font-size:19px;font-weight:600;letter-spacing:-.4px}
    .simulator-status{display:flex;align-items:center;gap:7px;color:#777;font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase}
    .lock{width:11px;height:9px;position:relative;display:inline-block;border:1px solid #777;border-radius:2px}
    .lock:before{content:"";position:absolute;width:5px;height:5px;left:2px;top:-6px;border:1px solid #777;border-bottom:0;border-radius:5px 5px 0 0}
    .simulator.available{cursor:pointer;border-color:#315d40;background:linear-gradient(145deg,#102719,#09170e);box-shadow:inset 0 0 35px rgba(61,150,91,.08)}
    .simulator.available:hover{background:linear-gradient(145deg,#173a25,#0d2114);border-color:#5a9a6d;box-shadow:inset 0 0 42px rgba(78,180,112,.15)}
    .simulator.available .simulator-status{color:#91cba0}
    .simulator.available .simulator-name{color:#e5f7e9}
    body{background:radial-gradient(ellipse at 50% 48%,rgba(25,83,48,.18),transparent 60%),#000}
    @media(max-width:520px){body{padding:28px 18px}.simulator-list{grid-template-columns:1fr}.simulator{min-height:96px}}
  </style>
</head>
<body>
  <main>
    <h1>SIMULATORS HUB</h1>
    <nav class="simulator-list" aria-label="Simulators">
      <a class="simulator available" href="survivor/index.html">
        <span class="simulator-name">Survivor</span>
        <span class="simulator-status">Open simulator →</span>
      </a>
      <a class="simulator" href="#" aria-disabled="true" tabindex="-1">
        <span class="simulator-name">Big Brother</span>
        <span class="simulator-status"><span class="lock" aria-hidden="true"></span> Coming soon</span>
      </a>
      <a class="simulator" href="#" aria-disabled="true" tabindex="-1">
        <span class="simulator-name">Danganronpa</span>
        <span class="simulator-status"><span class="lock" aria-hidden="true"></span> Coming soon</span>
      </a>
      <a class="simulator" href="#" aria-disabled="true" tabindex="-1">
        <span class="simulator-name">Peak</span>
        <span class="simulator-status"><span class="lock" aria-hidden="true"></span> Coming soon</span>
      </a>
    </nav>
  </main>
</body>
</html>
